<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Coil</title>
<link rel="stylesheet" href="src/tokens.css">
<style>
  /* Layout only. Every colour in this block is a token from src/tokens.css;
     there is no hex here, and there is none in the JavaScript either. */

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
  }

  body {
    font: 16px/1.5 ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono",
      Menlo, Consolas, monospace;
    /* 320 px is the floor the page has to survive without a sideways scroll,
       so nothing in here is given a fixed width. */
    min-width: 0;
    padding: clamp(8px, 2vw, 24px);
  }

  .page {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
    min-width: 0;
  }

  /* Two columns where there is room, stacked where there is not. The board
     stays first in the source order either way, so the reading order matches
     the visual one. */
  @media (min-width: 860px) {
    .page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      grid-template-areas: "head head" "board readout";
      align-items: start;
    }
    .masthead { grid-area: head; }
    .board { grid-area: board; }
    .panel { grid-area: readout; }
  }

  .masthead h1 {
    margin: 0;
    font-size: 1.1rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .masthead p {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 0.8125rem;
  }

  .board {
    min-width: 0;
    display: flex;
    justify-content: center;
  }

  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    /* The integer scale is computed in JS; this keeps the browser from
       resampling the backing store on top of it. */
    image-rendering: pixelated;
    /* The focus ring is drawn inside the canvas, as two strokes. A single
       outline here would be one colour, which phase 4 measured as unable to
       separate from the ramp. */
    outline: none;
    touch-action: none;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--lattice);
    padding: 12px 14px;
    min-width: 0;
  }

  .readout {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 12px;
    font-variant-numeric: tabular-nums;
  }

  .readout dt {
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    align-self: baseline;
  }

  .readout dd {
    margin: 0;
    text-align: right;
    font-size: 1rem;
  }

  .note {
    margin: 12px 0 0;
    color: var(--text-muted);
    font-size: 0.8125rem;
  }

  .hint {
    margin: 12px 0 0;
    padding: 8px 10px;
    border-left: 3px solid var(--ramp-2-tight);
    color: var(--text-primary);
    font-size: 0.8125rem;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<noscript>Coil needs JavaScript.</noscript>

<div class="page">
  <header class="masthead">
    <h1>Coil</h1>
    <p>Snake that shows you how much room you have left.</p>
  </header>

  <div class="board" id="board">
    <!-- role and aria-label are set from JS on state transitions only, never
         per tick, and this is never a live region. -->
    <canvas id="surface" tabindex="0" role="img" aria-label="Coil board."></canvas>
  </div>

  <div class="panel">
    <!-- The keyed nodes the readout writes through. They exist in the markup
         and are never rebuilt; src/ui/readout.js finds them once and writes
         textContent. -->
    <dl class="readout" id="readout">
      <dt>Score</dt><dd data-field="score">0</dd>
      <dt>Best</dt><dd data-field="highScore">0</dd>
      <dt>Space</dt><dd data-field="reachable">—</dd>
      <dt>Multiplier</dt><dd data-field="multiplier">—</dd>
      <dt>Confinement</dt><dd data-field="ramp">—</dd>
      <dt>Length</dt><dd data-field="length">—</dd>
    </dl>

    <!-- Written once, on game over. Not a live region: a sentence read aloud
         every tick is noise, and this is here to be found, not announced. -->
    <p class="visually-hidden" data-field="summary" id="summary"></p>

    <!-- One honest line when the stored save came from a newer build of the
         game and this session must not write over it. -->
    <p class="hint" data-field="hint" id="hint" hidden></p>

    <p class="note" id="phase-note">
      Phase 5 renders and runs the loop. Input arrives in phase 6, so the snake
      holds its heading, dies against a wall, and a fresh board follows.
    </p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
