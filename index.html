<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Coil</title>
<link rel="stylesheet" href="src/tokens.css">
<style>
  /* Layout only. Every colour in this block is a token from src/tokens.css;
     there is no hex here, and there is none in the JavaScript either. */

  *, *::before, *::after { box-sizing: border-box; }

  /* The `hidden` attribute is `display: none` in the UA stylesheet, which any
     author rule that sets `display` on the same element beats — so a region
     given `display: flex` here stays on the page while carrying `hidden`, and
     the game-over summary would be visible before a run had ended. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
  }

  body {
    font: 16px/1.5 ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono",
      Menlo, Consolas, monospace;
    /* 320 px is the floor the page has to survive without a sideways scroll,
       so nothing in here is given a fixed width. */
    min-width: 0;
    padding: clamp(8px, 2vw, 24px);
  }

  .page {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
    min-width: 0;
  }

  /* Two columns where there is room, stacked where there is not. The board
     stays first in the source order either way, so the reading order matches
     the visual one. */
  @media (min-width: 860px) {
    .page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      grid-template-areas: "head head" "board readout";
      align-items: start;
    }
    .masthead { grid-area: head; }
    .board { grid-area: board; }
    .panel { grid-area: readout; }
  }

  .masthead h1 {
    margin: 0;
    font-size: 1.1rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .masthead p {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 0.8125rem;
  }

  .board {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    /* The integer scale is computed in JS; this keeps the browser from
       resampling the backing store on top of it. */
    image-rendering: pixelated;
    /* The focus ring is drawn inside the canvas, as two strokes. A single
       outline here would be one colour, which phase 4 measured as unable to
       separate from the ramp. */
    outline: none;
    touch-action: none;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--lattice);
    padding: 12px 14px;
    min-width: 0;
  }

  .readout {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 12px;
    font-variant-numeric: tabular-nums;
  }

  .readout dt {
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    align-self: baseline;
  }

  .readout dd {
    margin: 0;
    text-align: right;
    font-size: 1rem;
  }

  .note {
    margin: 12px 0 0;
    color: var(--text-muted);
    font-size: 0.8125rem;
  }

  .hint {
    margin: 12px 0 0;
    padding: 8px 10px;
    border-left: 3px solid var(--ramp-2-tight);
    color: var(--text-primary);
    font-size: 0.8125rem;
  }

  /* Every control on the page: the restart button, the d-pad, the settings.
     One ring, drawn on :focus-visible so a mouse press does not leave one
     behind, and 2 px so it survives against the panel edge. */
  button, select, input[type="checkbox"] {
    font: inherit;
    color: var(--text-primary);
  }

  button:focus-visible,
  select:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .button {
    min-height: 44px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--wall);
    cursor: pointer;
  }

  .gameover {
    margin: 12px 0 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .gameover p {
    margin: 0;
  }

  /* The d-pad. Hidden where there is a pointer that hovers — a mouse or a
     trackpad has the keyboard beside it — and shown on a coarse pointer,
     which is a finger. 44 px minimum on every target. */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }

  @media (pointer: coarse) {
    .dpad { display: grid; }
  }

  .dpad button {
    min-width: 44px;
    min-height: 44px;
    width: 100%;
    height: 100%;
    background: var(--surface);
    border: 1px solid var(--wall);
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
  }

  .dpad button[data-direction="up"] { grid-column: 2; grid-row: 1; }
  .dpad button[data-direction="left"] { grid-column: 1; grid-row: 2; }
  .dpad button[data-direction="right"] { grid-column: 3; grid-row: 2; }
  .dpad button[data-direction="down"] { grid-column: 2; grid-row: 3; }

  .settings {
    margin: 16px 0 0;
    padding: 12px 0 0;
    border-top: 1px solid var(--lattice);
  }

  .settings h2 {
    margin: 0 0 8px;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .setting {
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.8125rem;
  }

  .setting select {
    background: var(--surface);
    border: 1px solid var(--wall);
    min-height: 44px;
    padding: 0 8px;
  }

  .setting input[type="checkbox"] {
    width: 22px;
    height: 22px;
    /* The label is part of the target; together they clear 44 px. */
    margin: 11px 0;
  }

  .setting label {
    min-height: 44px;
    display: flex;
    align-items: center;
    /* Shares the row with its checkbox and wraps its own text, rather than
       wrapping the whole row and leaving the checkbox stranded on a line of
       its own with its name underneath. */
    flex: 1 1 0;
    min-width: 0;
    cursor: pointer;
  }

  /* The select is wider than a checkbox and its label is not a click target
     for a tick, so that row stacks: label over control, both full width. */
  .setting-stacked {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }

  .setting-stacked label {
    flex: 0 0 auto;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<noscript>Coil needs JavaScript.</noscript>

<div class="page">
  <header class="masthead">
    <h1>Coil</h1>
    <p>Snake that shows you how much room you have left.</p>
  </header>

  <div class="board" id="board">
    <!-- role and aria-label are set from JS on state transitions only, never
         per tick, and this is never a live region. -->
    <canvas id="surface" tabindex="0" role="img" aria-label="Coil board."></canvas>

    <!-- Four real buttons, built by src/ui/dpad.js and appended here. Shown on
         a coarse pointer; the keyboard is the same four directions. -->
    <div class="dpad" id="dpad" data-role="dpad" role="group" aria-label="Steering"></div>
  </div>

  <div class="panel">
    <!-- The keyed nodes the readout writes through. They exist in the markup
         and are never rebuilt; src/ui/readout.js finds them once and writes
         textContent. -->
    <dl class="readout" id="readout">
      <dt>Score</dt><dd data-field="score">0</dd>
      <dt>Best</dt><dd data-field="highScore">0</dd>
      <dt>Space</dt><dd data-field="reachable">—</dd>
      <dt>Multiplier</dt><dd data-field="multiplier">—</dd>
      <dt>Confinement</dt><dd data-field="ramp">—</dd>
      <dt>Length</dt><dd data-field="length">—</dd>
    </dl>

    <!-- The game-over state. It stays until the player leaves it: phase 5's
         auto-restart timer is gone, and it is gone because it took this
         region, and the ramp step named inside it, away on a clock. -->
    <div class="gameover" data-role="gameover" id="gameover" hidden>
      <!-- Written once, at the transition. Not a live region: a sentence read
           aloud every tick is noise, and this is here to be found. -->
      <p class="visually-hidden" data-field="summary" id="summary"></p>
      <!-- The same news for a player who is looking rather than listening.
           Hidden from the accessibility tree so the summary above is not
           announced twice. -->
      <p aria-hidden="true">Run over.</p>
      <button type="button" class="button" data-role="restart"
              aria-label="Start a new run">New run</button>
    </div>

    <section class="settings" data-role="settings" aria-labelledby="settings-heading">
      <h2 id="settings-heading">Settings</h2>

      <p class="setting">
        <input type="checkbox" id="set-sound" data-setting="sound">
        <label for="set-sound">Sound</label>
      </p>

      <p class="setting">
        <input type="checkbox" id="set-step" data-setting="stepMode">
        <label for="set-step">Step mode: one move per key press</label>
      </p>

      <p class="setting setting-stacked">
        <label for="set-motion">Reduced motion</label>
        <!-- Three states, not two. The stored value is null, true or false,
             and null — follow the system setting — is the default, which a
             checkbox has nowhere to put. -->
        <select id="set-motion" data-setting="reducedMotion">
          <option value="system">Follow my system setting</option>
          <option value="on">Always reduce motion</option>
          <option value="off">Never reduce motion</option>
        </select>
      </p>

      <!-- One honest line when the stored save came from a newer build of the
           game and this session must not write over it. -->
      <p class="hint" data-field="hint" id="hint" hidden></p>

      <p class="note">
        Sound is saved now and synthesised in phase 7; nothing plays yet.
      </p>
    </section>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
